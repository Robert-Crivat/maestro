<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Maestro app icon. Rendered to PNG/ICNS by scripts/make-icon.sh -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6D5BFF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#E0457B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EDE9FF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1b0b3f" flood-opacity="0.40"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a0e5c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon body: 824 × 824 on a 1024 canvas -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 3 × 3 grid: the selected window takes the left two thirds -->
  <g fill="#ffffff">
    <rect x="636" y="236" width="152" height="164" rx="34" fill-opacity="0.55"/>
    <rect x="636" y="430" width="152" height="164" rx="34" fill-opacity="0.24"/>
    <rect x="636" y="624" width="152" height="164" rx="34" fill-opacity="0.24"/>
  </g>
  <g filter="url(#lift)">
    <rect x="236" y="236" width="370" height="552" rx="44" fill="url(#tile)"/>
  </g>
  <!-- window chrome on the selected tile -->
  <circle cx="290" cy="290" r="15" fill="#FF5F57"/>
  <circle cx="335" cy="290" r="15" fill="#FEBC2E"/>
  <circle cx="380" cy="290" r="15" fill="#28C840"/>
  <rect x="270" y="346" width="302" height="20" rx="10" fill="#7C3AED" fill-opacity="0.22"/>
  <rect x="270" y="388" width="240" height="20" rx="10" fill="#7C3AED" fill-opacity="0.16"/>
  <rect x="270" y="430" width="270" height="20" rx="10" fill="#7C3AED" fill-opacity="0.12"/>
</svg>
